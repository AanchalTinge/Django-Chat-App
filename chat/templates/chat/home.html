<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #2c3e50;
            padding: 20px;
            color: #fff;
        }
        .sidebar h3 {
            color: #fff;
        }
        .user-list {
            list-style: none;
            padding: 0;
        }
        .user-list li {
            margin: 15px 0;
        }
        .user-list a {
            text-decoration: none;
            color: #ecf0f1;
            font-size: 1.1em;
        }
        .user-list a:hover {
            color: #3498db;
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
            background-color: #ecf0f1;
            min-height: 100vh;
        }
        .main-content h1 {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Chat Users</h3>
        <ul class="user-list">
            {% for user in users %}
                <li>
                    <a href="{% url 'chat_room' user.id %}">{{ user.username }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
    <div class="main-content">
        <h1>Welcome, {{ request.user.username }}!</h1>
        <p>Select a user from the sidebar to start chatting.</p>
    </div>
</body>
</html>
